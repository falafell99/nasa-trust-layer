<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trust Layer</title>
<style>
@font-face{font-family:"DM Sans";src:url(/static/fonts/DMSans.ttf);font-weight:100 1000}
@font-face{font-family:"JetBrains Mono";src:url(/static/fonts/JetBrainsMono.ttf);font-weight:100 800}
:root{--bg:#f4efe6;--ink:#1f1b16;--mut:#7a7268;--rule:#ddd5c7;--band:#e8dec9;--alarm:#d1121b;--real:#8c2f2f;--yel:#c9962b;--gry:#8d877d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:18px 24px 28px}
.n{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.92em;letter-spacing:-.01em}
header{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:14px}
header h1{font-size:16px;font-weight:600;margin:0}
header p{margin:2px 0 0;color:var(--mut);font-size:14px;max-width:62ch}
nav{display:flex;gap:18px}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:inherit;font-size:14px;padding:2px 0;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--ink)}
nav button:focus-visible,.link:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.alarm{display:flex;gap:14px;align-items:baseline;margin:0 0 6px}
.alarm .k{color:var(--mut);font-size:14px}
.alarm .v{color:var(--alarm);font-size:22px;font-weight:700}
.alarm .m{color:var(--mut);font-size:14px}
canvas{width:100%;display:block}
.sig{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.action{margin:18px 0 12px;padding-left:16px;border-left:8px solid var(--gry);font-size:30px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.action.real{border-color:var(--real)}.action.yel{border-color:var(--yel)}.action.gry{border-color:var(--gry)}
.row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:7px 0;border-top:1px solid var(--rule);max-width:980px}
.row:last-of-type{border-bottom:1px solid var(--rule)}
.row .k{color:var(--mut);font-size:14px}
.row .t{font-size:15px}
.tools{margin-top:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.link{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ink);margin:8px 0 0}
.labels{color:var(--ink);font-size:14px;max-width:980px}
.foot{color:var(--mut);font-size:13px;margin-top:16px;max-width:90ch}
.err{color:var(--alarm)}
@media (max-width:640px){.action{font-size:23px}.row{grid-template-columns:1fr;gap:0}}
</style></head><body><main>
<header>
 <div><h1>Trust Layer, offline replay on recorded data.</h1><p>Earth data, not astronauts. Check step is a LightGBM model trained on ICU alarms, not clinically validated.</p></div>
 <nav id="nav" aria-label="Scenes"></nav>
</header>
<div id="view"></div><div class="foot" id="foot"></div>
</main>
<script>
const $=s=>document.querySelector(s);let D=null,cur=null;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const num=t=>String(t).replace(/(\d+(?:\.\d+)?)/g,'<span class="n">$1</span>');
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const CLS={red:'real',yellow:'yel',gray:'gry'};
async function init(){
 try{D=await (await fetch('/api/scenes')).json()}catch(e){$('#view').innerHTML='<p class="err">Could not load scenes: '+esc(e)+'</p>';return}
 const tabs=[];
 if(D.b)D.b.forEach(s=>tabs.push({id:s.id,label:s.title+' '+s.record,fn:()=>sceneB(s)}));
 if(D.a)tabs.push({id:'a',label:'A BUT QDB',fn:sceneA});
 Object.entries(D.errors).forEach(([k,v])=>tabs.push({id:'e'+k,label:'Error '+k,fn:()=>{$('#view').innerHTML='<p class="err">Scene not built: '+esc(v)+'</p>'}}));
 tabs.forEach(t=>{const b=document.createElement('button');b.textContent=t.label;b.id='tab_'+t.id;b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cur=t.fn;t.fn()};$('#nav').appendChild(b)});
 const q=new URLSearchParams(location.search).get('scene');(document.getElementById('tab_'+q)||$('#nav button')).click();
}
// Рисует ряды сигналов: min/max на пиксель. rows:[{x,name,h}]
function plot(cv,rows,o){
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
 const ink=css('--ink'),mut=css('--mut'),L=34,R=2,T=4,B=20,n=rows[0].x.length,tot=rows.reduce((a,r)=>a+r.h,0),pw=W-L-R;
 const X=t=>L+pw*t/o.dur;
 const bd=o.band||(o.hi?[o.dur-o.hi,o.dur]:null);if(bd)c.fillStyle=css('--band'),c.fillRect(X(bd[0]),T,X(bd[1])-X(bd[0]),H-T-B);
 let y0=T;const m={L,R,T,B,W,H,X};
 rows.forEach(r=>{const h=(H-T-B)*r.h/tot,s=r.x.slice().sort((a,b)=>a-b);let mn=s[Math.floor(s.length*.004)],mx=s[Math.floor(s.length*.996)];if(mx<=mn)mx=mn+1;
  c.fillStyle=mut;c.font='12px "JetBrains Mono",monospace';c.fillText(r.name,0,y0+11);c.strokeStyle=ink;c.lineWidth=1.1;c.beginPath();
  for(let px=0;px<pw;px++){const a=Math.floor(px/pw*n),b=Math.max(a+1,Math.floor((px+1)/pw*n));let lo=1e18,hi=-1e18;for(let k=a;k<b;k++){const v=r.x[k];if(v<lo)lo=v;if(v>hi)hi=v}
   const f=v=>y0+h-5-(Math.min(Math.max(v,mn),mx)-mn)/(mx-mn)*(h-12);c.moveTo(L+px+.5,f(lo));c.lineTo(L+px+.5,f(hi)+.6)}c.stroke();y0+=h});
 c.fillStyle=mut;c.font='12px "JetBrains Mono",monospace';for(let k=0;k<=6;k++){const t=o.t0+o.dur*k/6;c.fillText(Math.round(t)+' s',X(o.dur*k/6)-(k==6?24:k?10:0),H-5)}
 return m;
}
function sceneB(s){
 $('#view').innerHTML=`<div class="alarm"><span class="k">Original monitor alert</span><span class="v">${esc(s.alarm_type)}</span><span class="m">${num('record '+s.record+', raised at '+s.t_alarm+' s')}</span></div>
 <div class="sig"><canvas id="cv" style="height:min(46vh,380px)"></canvas></div>
 <div class="action ${CLS[s.state]}">${esc(s.action)}</div>
 <div class="row"><div class="k">Reason</div><div class="t">${num(esc(s.reason_line))}</div></div>
 <div class="row"><div class="k">Details</div><div class="t">${num(esc(s.detail_line))}</div></div>
 <div class="tools"><button class="link" id="rv">Show labels</button><span id="rvt" class="labels"></span><span>Shaded: the last ${num(s.highlight_s)} s the check used.</span></div>`;
 const w=$('#cv').clientWidth;plot($('#cv'),[{x:s.channels[0].x,name:s.channels[0].name,h:3},{x:s.channels[1].x,name:s.channels[1].name,h:3},{x:s.channels[2].x,name:'PPG',h:2}],{dur:30,t0:s.t_alarm-30,hi:s.highlight_s});
 let on=false;$('#rv').onclick=()=>{on=!on;$('#rv').textContent=on?'Hide labels':'Show labels';$('#rvt').innerHTML=on?num(esc(s.label_reveal)):''};
 $('#foot').textContent='Events come from the VTaC validation split by a fixed rule (first by ID with the needed outcome). They illustrate the logic and say nothing about accuracy. B3 shows a real alert the model did not confirm: it stays active.';
}
function sceneA(){
 const a=D.a;$('#view').innerHTML=`<div class="alarm"><span class="k">Source</span><span class="m" style="color:var(--ink);font-size:16px">${num(esc(a.record)+', '+a.duration_s+' s from second '+a.t0_s+'. No alarm in this clip.')}</span></div>
 <div class="sig"><canvas id="cv1" style="height:min(36vh,300px)"></canvas><canvas id="cv2" style="height:110px;border-top:1px solid var(--rule)"></canvas></div>
 <input type="range" id="sl" min="0" max="${a.windows.length-1}" value="0" aria-label="Window position">
 <div class="action gry" id="st"></div>
 <div class="row"><div class="k">Signal quality</div><div class="t" id="ql"></div></div>
 <div class="row"><div class="k">Check result</div><div class="t">No alarm here, so no event check was run. Windows are ${num(a.win_s)} s; sufficient quality starts at ${num(a.q_gate)} (preset).</div></div>
 <div class="tools"><button class="link" id="rv">Show labels</button><span id="rvt" class="labels"></span></div>`;
 let showL=false;const by=Object.entries(a.by_class);
 function draw(){const i=+$('#sl').value,w=a.windows[i];
  const m=plot($('#cv1'),[{x:a.ecg,name:'ECG',h:1}],{dur:a.duration_s,t0:0,band:[w.t-a.win_s,w.t]});const c2=$('#cv1').getContext('2d');
  if(showL){const cc=['','#8d877d','#c9962b','#8c2f2f'];a.class_per_s.forEach((k,t)=>{c2.fillStyle=cc[k];c2.fillRect(m.X(t),m.H-m.B-4,m.X(t+1)-m.X(t)+.5,4)})}
  const cv=$('#cv2'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const L=m.L,pw=W-L-m.R,yq=q=>6+(H-26)*(1-q);g.font='12px "JetBrains Mono",monospace';g.fillStyle=css('--mut');g.fillText('q',12,16);
  g.strokeStyle=css('--yel');g.setLineDash([4,3]);g.beginPath();g.moveTo(L,yq(a.q_gate));g.lineTo(W-m.R,yq(a.q_gate));g.stroke();g.setLineDash([]);g.fillText(a.q_gate.toFixed(2),L+3,yq(a.q_gate)-4);
  g.strokeStyle=css('--ink');g.lineWidth=1.3;g.beginPath();a.windows.forEach((ww,k)=>{const x=L+pw*ww.t/a.duration_s,y=yq(ww.q);k?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  const x=L+pw*w.t/a.duration_s;g.fillStyle=css('--ink');g.beginPath();g.arc(x,yq(w.q),4,0,7);g.fill();
  const low=w.q<a.q_gate;$('#st').className='action '+(low?'yel':'gry');$('#st').textContent=low?a.text_low:a.text_ok;
  $('#ql').innerHTML=num('Window '+(w.t-a.win_s)+' to '+w.t+' s: score '+w.q.toFixed(2)+' of 1 (experimental score, not a probability).')+(showL?num(' Accelerometer spread '+w.motion_mg+' mg. Expert consensus class in this window: '+w.cls+'.'):'');
 }
 $('#sl').oninput=draw;
 $('#rv').onclick=()=>{showL=!showL;$('#rv').textContent=showL?'Hide labels':'Show labels';
  $('#rvt').innerHTML=showL?num('Expert consensus: class 1 grey bar = P, QRS, T visible; 2 yellow = noisy, QRS still detectable; 3 brick = QRS not visible. Mean score by class: '+by.map(([k,v])=>'class '+k+' '+v.mean_q+' ('+v.n_windows+' windows, '+Math.round(v.share_below_gate*100)+'% below '+a.q_gate+')').join('; ')):'';draw()};
 draw();
 $('#foot').textContent='Quality metric is experimental. One 3-minute clip from one subject; it says nothing about accuracy or arrhythmia.';
}
window.addEventListener('resize',()=>{if(cur)cur()});init();
</script></body></html>
